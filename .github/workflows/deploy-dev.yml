name: Deploy to dev droplet

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-customer-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH + run deploy.sh on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: 9m
          script: /home/hoizr/hoizr-stack/deploy.sh customer-server
